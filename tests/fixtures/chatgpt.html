<!doctype html>
<html class="dark">
<head><title>Pricing the Reykjavík pilot | ChatGPT</title></head>
<body style="background:#212121;color:#ececec;font-family:system-ui">
<!-- An earlier conversation ChatGPT keeps mounted but hidden. -->
<div hidden>
  <div data-chatgpt-conversation-selection-target="true">
    <div data-turn-key="old-1"><div data-chatgpt-search-message-ids="old-a"><div class="markdown"><p>An older chat.</p></div></div>
      <div class="turn-action-controls"><button>Copy</button><button>Like</button><button>Dislike</button></div></div>
  </div>
</div>
<main>
  <div data-chatgpt-conversation-selection-target="true">
    <div data-turn-id-container>
      <div data-turn-key="t-1">
        <div data-chatgpt-search-message-ids="u1"><div class="bg-user-message"><div class="whitespace-pre-wrap">What should we charge for the pilot?
Keep it short.</div></div></div>
        <div class="turn-action-controls"><span><button aria-label="Copy message">Copy</button></span><button aria-label="Edit message">Edit</button></div>
      </div>
    </div>
    <div data-turn-id-container>
      <div data-turn-key="t-2">
        <div data-chatgpt-search-message-ids="a2a"><div class="markdown"><h1>Pilot pricing</h1><p>Charge $40 a month per seat.</p></div></div>
        <div data-chatgpt-search-message-ids="a2b"><div class="markdown"><p>A second source agrees.</p></div></div>
        <div class="turn-action-controls" style="display:flex;gap:4px">
          <span data-state="closed"><button aria-label="Copy">Copy</button></span>
          <span data-state="closed"><button aria-label="Good response">Like</button></span>
          <button aria-label="Read aloud">Speak</button>
          <button aria-label="Share">Share</button>
          <button aria-label="More actions">…</button>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
